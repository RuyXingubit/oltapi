name: CI Test & Code Quality

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Pytest & Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r requirements.txt

      - name: Verify OpenAPI Contract Sync
        run: |
          python -m scripts.export_openapi
          git diff --exit-code docs/api_contracts/

      - name: Run Built-in SAST, SCA, Complexity & Duplication Quality Gate
        run: |
          python -m scripts.quality_gate

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=60
          sed -i "s|<source>${GITHUB_WORKSPACE}/app</source>|<source>app</source>|g" coverage.xml

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 1

  test-frontend:
    name: Frontend Flutter Analyze & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests (with Coverage)
        run: |
          flutter test --coverage
          sed -i 's|^SF:lib/|SF:frontend/lib/|g' coverage/lcov.info

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonarqube:
    name: SonarQube Cloud Scan
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Backend Coverage Report
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: .

      - name: Download Frontend Coverage Report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
