name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
      - '.agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Pytest & OpenAPI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify OpenAPI Contract Sync
        run: |
          python -m scripts.export_openapi
          git diff --exit-code docs/api_contracts/

      - name: Execute Tests (with Testcontainers & Coverage)
        run: |
          pytest tests/ -v --cov=app --cov-report=xml
          sed -i "s|<source>${GITHUB_WORKSPACE}/app</source>|<source>app</source>|g" coverage.xml

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 1

  test-frontend:
    name: Frontend Flutter Analyze & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests (with Coverage)
        run: |
          flutter test --coverage
          sed -i 's|^SF:lib/|SF:frontend/lib/|g' coverage/lcov.info

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonarqube:
    name: SonarQube Cloud Scan
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Backend Coverage Report
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: .

      - name: Download Frontend Coverage Report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release-and-publish:
    name: Release & Docker Push
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write # Needed for semantic-release to create tags
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        if: steps.semantic.outputs.new_release_published == 'true'
        id: meta_backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/oltapi
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.semantic.outputs.new_release_version }}

      - name: Build and Push Backend image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extract Docker metadata for Frontend
        if: steps.semantic.outputs.new_release_published == 'true'
        id: meta_frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/oltapi-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.semantic.outputs.new_release_version }}

      - name: Build and Push Frontend image
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
