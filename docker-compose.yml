services:
  oltapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oltapi
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-OLT Provisioning & Diagnostics API}
      - API_KEY=${API_KEY:-oltapi_secret_default_key_change_me}
      - DEFAULT_SSH_TIMEOUT=${DEFAULT_SSH_TIMEOUT:-15}
      - BACKUP_RETENTION_MAX=${BACKUP_RETENTION_MAX:-30}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

