services:
  postgres:
    image: postgres:16-alpine
    container_name: oltapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oltapi}
      POSTGRES_USER: ${POSTGRES_USER:-oltuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oltpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oltuser} -d ${POSTGRES_DB:-oltapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  oltapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oltapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-OLT Provisioning & Diagnostics API}
      - API_KEY=${API_KEY:-oltapi_secret_default_key_change_me}
      - POSTGRES_USER=${POSTGRES_USER:-oltuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-oltpassword}
      - POSTGRES_DB=${POSTGRES_DB:-oltapi}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-}
      - DEFAULT_SSH_TIMEOUT=${DEFAULT_SSH_TIMEOUT:-15}
      - BACKUP_RETENTION_MAX=${BACKUP_RETENTION_MAX:-30}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./app:/app/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

