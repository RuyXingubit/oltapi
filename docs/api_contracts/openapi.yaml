openapi: 3.1.0
info:
  title: OLT Provisioning & Diagnostics Unified API
  description: API REST padronizada para provisionamento multi-fabricante de OLTs, coleta de configurações, gestão de backups e diagnóstico óptico.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Servidor Local de Desenvolvimento
paths:
  /api/v1/olts:
    get:
      summary: Listar OLTs cadastradas
      description: Retorna a lista de todas as OLTs disponíveis para provisionamento e gerência.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de OLTs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OLTResponse'
    post:
      summary: Cadastrar nova OLT
      description: Adiciona uma nova OLT ao inventário da API.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OLTCreateRequest'
      responses:
        '201':
          description: OLT cadastrada com sucesso com teste de conectividade e links guiados
          headers:
            Location:
              description: URI canônica da OLT recém-cadastrada
              schema:
                type: string
                example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OLTResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}:
    get:
      summary: Consultar detalhes da OLT com links HATEOAS
      description: Retorna os dados cadastrais da OLT e links de navegação para config, ONUs e backups.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da OLT (UUIDv7)
      responses:
        '200':
          description: Detalhes da OLT com links contextuais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OLTResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/test-connection:
    post:
      summary: Testar conectividade TCP com a OLT
      description: Executa checagem rápida de conectividade na porta da OLT, medindo latência e retornando links de ação.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da OLT (UUIDv7)
      responses:
        '200':
          description: Resultado do teste de conectividade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/config:
    get:
      summary: Visualizar configurações da OLT (running-config)
      description: Executa a leitura direta do running-config da OLT e entrega o texto consolidado.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da OLT (UUIDv7)
      responses:
        '200':
          description: Configuração coletada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OLTConfigResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups:
    get:
      summary: Listar histórico de backups da OLT
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Histórico de backups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupMetadata'
    post:
      summary: Disparar e salvar novo backup da OLT
      description: Conecta na OLT, gera a cópia de segurança, armazena no disco local protegido com identificador UUIDv7 e calcula hash SHA-256.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Backup gerado e salvo com sucesso
          headers:
            Location:
              description: URI para download direto do arquivo de backup gerado
              schema:
                type: string
                example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde/backups/0191e512-3456-789a-bcde-f0123456789a/download"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupMetadata'
        '502':
          description: Erro ao coletar backup da OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/{backup_id}/download:
    get:
      summary: Download do arquivo de backup
      description: Entrega o arquivo binário/texto bruto do backup para o ERP ou técnico.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: backup_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arquivo de backup para download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Arquivo de backup não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/audit:
    get:
      summary: Relatório de integridade e auditoria de backups da OLT
      description: Retorna contadores, espaço em disco e se houve alteração (drift) entre os últimos backups.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Relatório de auditoria de backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupAuditReport'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/compare:
    get:
      summary: Comparar dois backups da OLT (Integridade SHA-256 e Unified Diff)
      description: Compara os hashes SHA-256 e gera unified diff entre dois backups específicos ou os dois mais recentes.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: base_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: target_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resultado da comparação e diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDiffResult'
        '404':
          description: Backups insuficientes ou não encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/purge:
    post:
      summary: Expurgo e retenção de backups da OLT
      description: Executa a política de retenção liberando espaço físico em disco.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgePolicy'
      responses:
        '200':
          description: Resultado do expurgo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResult'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/ports/{port}/onus:
    get:
      summary: Listar ONUs de uma porta PON
      description: Retorna as ONUs ativas na porta informada.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: port
          in: path
          required: true
          schema:
            type: string
            example: "1/1"
      responses:
        '200':
          description: Lista de ONUs na porta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ONUSummary'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}:
    get:
      summary: Consultar detalhes e sinal óptico de uma ONU
      description: Obtém status de conexão, potência óptica (Rx/Tx em dBm) e informações de cadastro.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
      responses:
        '200':
          description: Detalhes e diagnóstico da ONU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUDetails'
        '404':
          description: ONU não encontrada na OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Desprovisionar e remover ONU da OLT
      description: Remove o registro da ONU na OLT liberando a porta PON e recursos alocados.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
          description: Porta PON da ONU (opcional)
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
          description: ID numérico da ONU (opcional)
      responses:
        '200':
          description: ONU desprovisionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT ou ONU não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}/reboot:
    post:
      summary: Reiniciar remotamente a ONU (Reboot OMCI)
      description: Envia comando de reinicialização remota via protocolo de controle OMCI através da OLT.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Comando de reinicialização enviado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}/suspend:
    post:
      summary: Suspender administrativamente a ONU (Bloqueio por inadimplência)
      description: Desativa administrativamente o tráfego GPON da ONU mantendo os dados cadastrais intactos.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: ONU suspensa administrativamente com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}/resume:
    post:
      summary: Reativar ONU suspensa (Desbloqueio financeiro)
      description: Restabelece o tráfego GPON da ONU suspensa após confirmação de pagamento.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: ONU reativada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/unauthorized:
    get:
      summary: Listar ONUs não autorizadas (descobertas)
      description: Retorna a lista de ONUs conectadas fisicamente que aguardam autorização (autofind/unassigned).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de ONUs descobertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnauthorizedONU'

  /api/v1/olts/{olt_id}/onus:
    post:
      summary: Provisionar nova ONU
      description: Autoriza a ONU na porta PON associando VLAN, perfil e descrição.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '201':
          description: ONU provisionada com sucesso
          headers:
            Location:
              description: URI canônica para consulta dos detalhes e potência óptica da ONU provisionada
              schema:
                type: string
                example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde/onus/INCL12345678"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
        '400':
          description: Parâmetros inválidos ou violação de validação de segurança
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ONU já cadastrada ou porta cheia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/bootstrap/preview:
    post:
      summary: Gerar preview do script de configuração inicial da OLT (Dry-Run)
      description: Retorna os comandos CLI que serão aplicados para configurar a OLT virgem (Uplink, VLANs, bridges, binds de ONUs e auto-service).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Script de comandos gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPreviewResponse'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/bootstrap/apply:
    post:
      summary: Aplicar configuração inicial na OLT física (Zero-Touch Provisioning)
      description: Conecta na OLT, executa a sequência completa de configuração, ativa o auto-service, grava na memória e gera um backup de segurança inicial.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Configuração inicial aplicada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapApplyResponse'
        '400':
          description: Erro nos parâmetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Erro de conexão com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/backups/run-all:
    post:
      summary: Disparar rotina de backup em lote para todas as OLTs
      description: Executa coleta paralela/sequencial de backup em todo o parque de OLTs com expurgo automático.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: purge_after
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgePolicy'
      responses:
        '200':
          description: Resultado da execução do lote de backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchBackupResult'

  /api/v1/backups/audit-all:
    get:
      summary: Auditoria consolidada de integridade de todo o parque de OLTs
      description: Retorna o status de integridade, contagem e drifts de cada OLT.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de relatórios de auditoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupAuditReport'

  /api/v1/backups/purge-all:
    post:
      summary: Expurgo global de backups em todas as OLTs
      description: Aplica a política de retenção liberando espaço em disco para todas as OLTs.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgePolicy'
      responses:
        '200':
          description: Resultado do expurgo global
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResult'

  /api/v1/onus:
    get:
      summary: Listar ONUs do inventário global
      description: Retorna todas as ONUs com dados de contrato ERP, Circuit ID TR-101 e coordenadas GPS.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: query
          required: false
          schema:
            type: string
        - name: port
          in: query
          required: false
          schema:
            type: string
        - name: contract_status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, CANCELLED, IN_STOCK]
        - name: contract_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de equipamentos no inventário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ONUInventoryItem'
    post:
      summary: Cadastrar ou vincular ONU no inventário
      description: Registra uma ONU ancorando seu serial de hardware ao contrato do assinante e topologia física.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterONUInventoryRequest'
      responses:
        '201':
          description: ONU cadastrada com sucesso com Location header e links HATEOAS
          headers:
            Location:
              description: URI canônica da ONU
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUInventoryItem'

  /api/v1/onus/history:
    get:
      summary: Linha do Tempo Global de Movimentações (NOC Timeline)
      description: Auditoria completa e reversa de todas as manobras físicas, trocas de POP e correções automáticas de fusão.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: serial
          in: query
          required: false
          schema:
            type: string
        - name: from_olt_id
          in: query
          required: false
          schema:
            type: string
        - name: to_olt_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Eventos cronológicos da linha do tempo do NOC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ONUMigrationEvent'

  /api/v1/onus/reconcile-field-event:
    post:
      summary: Motor de Auto-Recuperação e Conciliação Reativa de Campo
      description: Processa evento de autofind em campo. Se contrato ativo, provisiona nova posição, limpa a antiga fantasma e recalcula Circuit ID TR-101.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileFieldEventRequest'
      responses:
        '200':
          description: Resultado da conciliação e manobra executada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileFieldEventResponse'

  /api/v1/onus/{serial}:
    get:
      summary: Consultar dados cadastrais, topologia e status de uma ONU
      description: Retorna visão 360º da ONU incluindo coordenadas geográficas e identificador Broadband Forum TR-101.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: serial
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados detalhados do inventário da ONU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUInventoryItem'
        '404':
          description: ONU não encontrada

  /api/v1/onus/{serial}/history:
    get:
      summary: Histórico individual de movimentações de uma ONU
      description: Retorna todas as migrações entre portas e OLTs sofridas por este hardware específico.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: serial
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Histórico cronológico desta ONU
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ONUMigrationEvent'

  /api/v1/webhooks:
    get:
      summary: Listar assinaturas de Webhook
      description: Retorna todos os endpoints de ERPs cadastrados para recebimento de eventos push em tempo real.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: active_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de assinaturas de webhook
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
    post:
      summary: Cadastrar webhook para o ERP
      description: Registra uma URL para envio de eventos com assinatura digital HMAC SHA-256 no cabeçalho X-OLTAPI-Signature.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook cadastrado com sucesso
          headers:
            Location:
              description: URI canônica da assinatura
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'

  /api/v1/webhooks/deliveries:
    get:
      summary: Consultar histórico de entregas de webhooks
      description: Logs de auditoria das tentativas de envio de eventos push aos ERPs com status HTTP e latência.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Logs de auditoria de entregas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDeliveryLog'

  /api/v1/webhooks/{subscription_id}:
    get:
      summary: Consultar assinatura de webhook
      description: Retorna dados cadastrais, eventos monitorados e secret da assinatura.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dados da assinatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '404':
          description: Webhook não encontrado
    delete:
      summary: Remover assinatura de webhook
      description: Cancela o envio de eventos push para a URL especificada.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Assinatura removida com sucesso
        '404':
          description: Webhook não encontrado

  /api/v1/webhooks/{subscription_id}/ping:
    post:
      summary: Disparar ping de teste HMAC para o ERP
      description: Envia uma requisição HTTP POST assinado com HMAC SHA-256 para validar a integridade da comunicação com o ERP.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Relatório imediato da tentativa de entrega
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryLog'
        '404':
          description: Webhook não encontrado

  /api/v1/scanner/status:
    get:
      summary: Consultar status do Autofind Scanner
      description: Retorna o estado operacional do worker (ativo/inativo), intervalo atual e métricas acumuladas com links HATEOAS.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Status atual do scanner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerStatus'

  /api/v1/scanner/start:
    post:
      summary: Iniciar worker do Autofind Scanner
      description: Inicia o loop assíncrono periódico de varredura em segundo plano.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Scanner iniciado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerStatus'

  /api/v1/scanner/stop:
    post:
      summary: Parar worker do Autofind Scanner
      description: Interrompe graciosamente o loop de varredura periódica.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Scanner parado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerStatus'

  /api/v1/scanner/run-now:
    post:
      summary: Forçar varredura de autofind sob demanda
      description: Executa imediatamente um ciclo de varredura em todas as OLTs cadastradas e retorna o resultado detalhado.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Resultado detalhado do ciclo de varredura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerRunResult'

  /api/v1/scanner/interval:
    patch:
      summary: Atualizar intervalo de varredura
      description: Modifica a cadência periódica em segundos (mínimo defensivo: 10s).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScannerIntervalUpdateRequest'
      responses:
        '200':
          description: Intervalo atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerStatus'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave de API secreta para autenticação de clientes externos.

  schemas:
    OLTCreateRequest:
      type: object
      required:
        - name
        - vendor
        - model
        - host
        - username
        - password
      properties:
        name:
          type: string
          example: "OLT-POP-CENTRO"
        vendor:
          type: string
          enum: [intelbras, huawei, fiberhome, vsol, zte, parks]
          example: "intelbras"
        model:
          type: string
          example: "8820"
        host:
          type: string
          example: "192.168.10.2"
        port:
          type: integer
          default: 22
          example: 22
        protocol:
          type: string
          enum: [ssh, telnet]
          default: ssh
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "admin123"

    Link:
      type: object
      required:
        - href
        - method
      properties:
        href:
          type: string
          example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde"
        method:
          type: string
          example: "GET"
        description:
          type: string
          example: "Ver detalhes da OLT"

    ConnectionTestResult:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        host:
          type: string
        port:
          type: integer
        reachable:
          type: boolean
        latency_ms:
          type: number
          format: float
          nullable: true
        message:
          type: string
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    OLTResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "0191e4f2-51a8-7d84-a12b-3456789abcde"
        name:
          type: string
        vendor:
          type: string
        model:
          type: string
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
        status:
          type: string
          example: "online"
        connection_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    OLTConfigResponse:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        collected_at:
          type: string
          format: date-time
        config_text:
          type: string
          description: Conteúdo textual completo do running-config.
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    BackupMetadata:
      type: object
      properties:
        backup_id:
          type: string
          format: uuid
          description: Identificador único no padrão UUIDv7.
        olt_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
        sha256_hash:
          type: string
        filename:
          type: string
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    BackupDiffResult:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        base_backup_id:
          type: string
          format: uuid
        target_backup_id:
          type: string
          format: uuid
        identical:
          type: boolean
          description: Indica se os backups possuem hash SHA-256 idêntico.
        base_sha256:
          type: string
        target_sha256:
          type: string
        diff_lines:
          type: array
          items:
            type: string
        additions_count:
          type: integer
        deletions_count:
          type: integer

    BackupAuditReport:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        olt_name:
          type: string
        total_backups:
          type: integer
        total_bytes:
          type: integer
        latest_backup:
          $ref: '#/components/schemas/BackupMetadata'
        previous_backup:
          $ref: '#/components/schemas/BackupMetadata'
        has_changed:
          type: boolean
        last_backup_at:
          type: string
          format: date-time

    PurgePolicy:
      type: object
      properties:
        max_backups_per_olt:
          type: integer
          default: 30
          minimum: 1
        max_age_days:
          type: integer
          minimum: 1

    PurgeResult:
      type: object
      properties:
        olt_id:
          type: string
          nullable: true
        deleted_count:
          type: integer
        freed_bytes:
          type: integer
        remaining_count:
          type: integer

    BatchBackupResult:
      type: object
      properties:
        total_olts:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        backups:
          type: array
          items:
            $ref: '#/components/schemas/BackupMetadata'
        errors:
          type: array
          items:
            type: object

    ONUSummary:
      type: object
      properties:
        port:
          type: string
          example: "1/1"
        onu_id:
          type: integer
          example: 1
        serial:
          type: string
          example: "INCL12345678"
        status:
          type: string
          example: "online"
        name:
          type: string
          example: "Cliente_Joao"

    ONUDetails:
      type: object
      properties:
        port:
          type: string
        onu_id:
          type: integer
        serial:
          type: string
        status:
          type: string
          example: "online"
        name:
          type: string
        rx_power_dbm:
          type: number
          format: float
          example: -19.45
        tx_power_dbm:
          type: number
          format: float
          example: 2.10
        vlan:
          type: integer
          example: 100

    UnauthorizedONU:
      type: object
      properties:
        port:
          type: string
          example: "1/1"
        serial:
          type: string
          example: "INCL12345678"
        model:
          type: string
          example: "110B"
        detected_at:
          type: string
          format: date-time
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    ProvisionRequest:
      type: object
      required:
        - port
        - serial
        - vlan
      properties:
        port:
          type: string
          example: "1/1"
        serial:
          type: string
          example: "INCL12345678"
        vlan:
          type: integer
          minimum: 1
          maximum: 4094
          example: 100
        profile:
          type: string
          example: "PLAN_100M"
        description:
          type: string
          example: "Cliente_Joao_Silva"
        onu_model:
          type: string
          example: "auto"

    ProvisionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        port:
          type: string
          example: "1/1"
        onu_id:
          type: integer
          example: 3
        serial:
          type: string
          example: "INCL12345678"
        message:
          type: string
          example: "ONU provisionada e salva com sucesso na memória da OLT."
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    ONUActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        action:
          type: string
          example: "deprovision"
          enum: [deprovision, reboot, suspend, resume]
        olt_id:
          type: string
          format: uuid
          example: "0191e4f2-51a8-7d84-a12b-3456789abcde"
        serial:
          type: string
          example: "INCL12345678"
        port:
          type: string
          example: "1/1"
        onu_id:
          type: integer
          example: 1
        message:
          type: string
          example: "ONU desprovisionada com sucesso."
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Descrição detalhada do erro."
        code:
          type: string
          example: "CLI_COMMAND_FAILED"

    BootstrapRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [single_vlan, vlan_per_pon]
          default: single_vlan
        uplink_port:
          type: string
          default: "1"
          example: "1"
        vlan:
          type: integer
          minimum: 1
          maximum: 4094
          default: 100
          example: 100
        vlan_per_pon:
          type: object
          additionalProperties:
            type: integer
          example: {"1": 101, "2": 102}
        default_onu_mode:
          type: string
          enum: [router, bridge]
          default: router
        force:
          type: boolean
          default: false

    BootstrapPreviewResponse:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        mode:
          type: string
        commands:
          type: array
          items:
            type: string
        script_text:
          type: string
        total_commands:
          type: integer

    BootstrapApplyResponse:
      type: object
      properties:
        success:
          type: boolean
        olt_id:
          type: string
          format: uuid
        backup_id:
          type: string
          format: uuid
        total_commands_executed:
          type: integer
        message:
          type: string

    ONUInventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "0191e4f2-51a8-7d84-a12b-3456789abcde"
        serial:
          type: string
          example: "INCL12345678"
        contract_id:
          type: string
          nullable: true
          example: "CTR-100200"
        subscriber_name:
          type: string
          nullable: true
          example: "Empresa XPTO Fibra"
        contract_status:
          type: string
          enum: [ACTIVE, SUSPENDED, CANCELLED, IN_STOCK]
          example: "ACTIVE"
        vlan:
          type: integer
          nullable: true
          example: 100
        profile:
          type: string
          example: "DEFAULT"
        description:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
          example: -23.55052
        longitude:
          type: number
          format: float
          nullable: true
          example: -46.633308
        current_olt_id:
          type: string
          format: uuid
          nullable: true
        current_port:
          type: string
          nullable: true
          example: "1/1"
        current_onu_id:
          type: integer
          nullable: true
          example: 4
        circuit_id:
          type: string
          nullable: true
          example: "OLT-CENTRAL-01 eth 1/1:4:100"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HateoasLink'

    RegisterONUInventoryRequest:
      type: object
      required:
        - serial
      properties:
        serial:
          type: string
          example: "INCL12345678"
        olt_id:
          type: string
          nullable: true
        port:
          type: string
          nullable: true
          example: "1/1"
        onu_id:
          type: integer
          nullable: true
          example: 4
        vlan:
          type: integer
          nullable: true
          example: 100
        profile:
          type: string
          default: "DEFAULT"
        contract_id:
          type: string
          nullable: true
          example: "CTR-100200"
        subscriber_name:
          type: string
          nullable: true
          example: "Empresa XPTO Fibra"
        contract_status:
          type: string
          enum: [ACTIVE, SUSPENDED, CANCELLED, IN_STOCK]
          default: "ACTIVE"
        description:
          type: string
          nullable: true
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true

    ReconcileFieldEventRequest:
      type: object
      required:
        - serial
        - detected_olt_id
        - detected_port
      properties:
        serial:
          type: string
          example: "INCL12345678"
        detected_olt_id:
          type: string
          format: uuid
        detected_port:
          type: string
          example: "1/2"
        detected_onu_id:
          type: integer
          nullable: true
          example: 5
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
        reason:
          type: string
          default: "field_event_auto_reconciliation"
          example: "Fusão invertida na caixa CEO-04"

    ReconcileFieldEventResponse:
      type: object
      properties:
        success:
          type: boolean
        action_taken:
          type: string
          enum: [reconciled_intra_olt, reconciled_cross_olt, rejected_in_stock_onu, onu_not_found]
        serial:
          type: string
        contract_id:
          type: string
          nullable: true
        subscriber_name:
          type: string
          nullable: true
        old_olt_id:
          type: string
          nullable: true
        new_olt_id:
          type: string
          nullable: true
        old_port:
          type: string
          nullable: true
        new_port:
          type: string
          nullable: true
        old_onu_id:
          type: integer
          nullable: true
        new_onu_id:
          type: integer
          nullable: true
        old_circuit_id:
          type: string
          nullable: true
        new_circuit_id:
          type: string
          nullable: true
        message:
          type: string
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HateoasLink'

    ONUMigrationEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        serial:
          type: string
        contract_id:
          type: string
          nullable: true
        subscriber_name:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        reason:
          type: string
        from_olt_id:
          type: string
          nullable: true
        from_olt_name:
          type: string
          nullable: true
        from_port:
          type: string
          nullable: true
        from_onu_id:
          type: integer
          nullable: true
        from_circuit_id:
          type: string
          nullable: true
        to_olt_id:
          type: string
        to_olt_name:
          type: string
        to_port:
          type: string
        to_onu_id:
          type: integer
        to_circuit_id:
          type: string
        status:
          type: string
          example: "success"
        details:
          type: string
          nullable: true
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HateoasLink'

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        secret:
          type: string
        events:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HateoasLink'

    WebhookCreateRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: "https://erp.provedor.com.br/api/v1/webhooks/oltapi"
        secret:
          type: string
          nullable: true
          example: "whsec_custom_secret_key"
        events:
          type: array
          items:
            type: string
          default: ["*"]
          example: ["onu.reconciled", "onu.detected"]
        is_active:
          type: boolean
          default: true
        description:
          type: string
          nullable: true
          example: "ERP IXC Soft Matriz"

    WebhookDeliveryLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event:
          type: string
          example: "onu.reconciled"
        url:
          type: string
          format: uri
        status_code:
