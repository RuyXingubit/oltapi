openapi: 3.1.0
info:
  title: OLT Provisioning & Diagnostics Unified API
  description: API REST padronizada para provisionamento multi-fabricante de OLTs, coleta de configurações, gestão de backups e diagnóstico óptico.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Servidor Local de Desenvolvimento
paths:
  /api/v1/olts:
    get:
      summary: Listar OLTs cadastradas
      description: Retorna a lista de todas as OLTs disponíveis para provisionamento e gerência.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de OLTs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OLTResponse'
    post:
      summary: Cadastrar nova OLT
      description: Adiciona uma nova OLT ao inventário da API.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OLTCreateRequest'
      responses:
        '201':
          description: OLT cadastrada com sucesso com teste de conectividade e links guiados
          headers:
            Location:
              description: URI canônica da OLT recém-cadastrada
              schema:
                type: string
                example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OLTResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}:
    get:
      summary: Consultar detalhes da OLT com links HATEOAS
      description: Retorna os dados cadastrais da OLT e links de navegação para config, ONUs e backups.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da OLT (UUIDv7)
      responses:
        '200':
          description: Detalhes da OLT com links contextuais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OLTResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/test-connection:
    post:
      summary: Testar conectividade TCP com a OLT
      description: Executa checagem rápida de conectividade na porta da OLT, medindo latência e retornando links de ação.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da OLT (UUIDv7)
      responses:
        '200':
          description: Resultado do teste de conectividade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/config:
    get:
      summary: Visualizar configurações da OLT (running-config)
      description: Executa a leitura direta do running-config da OLT e entrega o texto consolidado.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da OLT (UUIDv7)
      responses:
        '200':
          description: Configuração coletada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OLTConfigResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups:
    get:
      summary: Listar histórico de backups da OLT
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Histórico de backups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupMetadata'
    post:
      summary: Disparar e salvar novo backup da OLT
      description: Conecta na OLT, gera a cópia de segurança, armazena no disco local protegido com identificador UUIDv7 e calcula hash SHA-256.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Backup gerado e salvo com sucesso
          headers:
            Location:
              description: URI para download direto do arquivo de backup gerado
              schema:
                type: string
                example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde/backups/0191e512-3456-789a-bcde-f0123456789a/download"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupMetadata'
        '502':
          description: Erro ao coletar backup da OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/{backup_id}/download:
    get:
      summary: Download do arquivo de backup
      description: Entrega o arquivo binário/texto bruto do backup para o ERP ou técnico.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: backup_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Arquivo de backup para download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Arquivo de backup não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/audit:
    get:
      summary: Relatório de integridade e auditoria de backups da OLT
      description: Retorna contadores, espaço em disco e se houve alteração (drift) entre os últimos backups.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Relatório de auditoria de backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupAuditReport'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/compare:
    get:
      summary: Comparar dois backups da OLT (Integridade SHA-256 e Unified Diff)
      description: Compara os hashes SHA-256 e gera unified diff entre dois backups específicos ou os dois mais recentes.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: base_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: target_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resultado da comparação e diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDiffResult'
        '404':
          description: Backups insuficientes ou não encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/backups/purge:
    post:
      summary: Expurgo e retenção de backups da OLT
      description: Executa a política de retenção liberando espaço físico em disco.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgePolicy'
      responses:
        '200':
          description: Resultado do expurgo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResult'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/ports/{port}/onus:
    get:
      summary: Listar ONUs de uma porta PON
      description: Retorna as ONUs ativas na porta informada.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: port
          in: path
          required: true
          schema:
            type: string
            example: "1/1"
      responses:
        '200':
          description: Lista de ONUs na porta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ONUSummary'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}:
    get:
      summary: Consultar detalhes e sinal óptico de uma ONU
      description: Obtém status de conexão, potência óptica (Rx/Tx em dBm) e informações de cadastro.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
      responses:
        '200':
          description: Detalhes e diagnóstico da ONU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUDetails'
        '404':
          description: ONU não encontrada na OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Desprovisionar e remover ONU da OLT
      description: Remove o registro da ONU na OLT liberando a porta PON e recursos alocados.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
          description: Porta PON da ONU (opcional)
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
          description: ID numérico da ONU (opcional)
      responses:
        '200':
          description: ONU desprovisionada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT ou ONU não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}/reboot:
    post:
      summary: Reiniciar remotamente a ONU (Reboot OMCI)
      description: Envia comando de reinicialização remota via protocolo de controle OMCI através da OLT.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Comando de reinicialização enviado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}/suspend:
    post:
      summary: Suspender administrativamente a ONU (Bloqueio por inadimplência)
      description: Desativa administrativamente o tráfego GPON da ONU mantendo os dados cadastrais intactos.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: ONU suspensa administrativamente com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/onus/{serial_or_id}/resume:
    post:
      summary: Reativar ONU suspensa (Desbloqueio financeiro)
      description: Restabelece o tráfego GPON da ONU suspensa após confirmação de pagamento.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: serial_or_id
          in: path
          required: true
          schema:
            type: string
            example: "INCL12345678"
        - name: port
          in: query
          required: false
          schema:
            type: string
            example: "1/1"
        - name: onu_id
          in: query
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: ONU reativada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ONUActionResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Falha na comunicação com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/unauthorized:
    get:
      summary: Listar ONUs não autorizadas (descobertas)
      description: Retorna a lista de ONUs conectadas fisicamente que aguardam autorização (autofind/unassigned).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de ONUs descobertas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnauthorizedONU'

  /api/v1/olts/{olt_id}/onus:
    post:
      summary: Provisionar nova ONU
      description: Autoriza a ONU na porta PON associando VLAN, perfil e descrição.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '201':
          description: ONU provisionada com sucesso
          headers:
            Location:
              description: URI canônica para consulta dos detalhes e potência óptica da ONU provisionada
              schema:
                type: string
                example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde/onus/INCL12345678"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
        '400':
          description: Parâmetros inválidos ou violação de validação de segurança
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ONU já cadastrada ou porta cheia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/bootstrap/preview:
    post:
      summary: Gerar preview do script de configuração inicial da OLT (Dry-Run)
      description: Retorna os comandos CLI que serão aplicados para configurar a OLT virgem (Uplink, VLANs, bridges, binds de ONUs e auto-service).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Script de comandos gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapPreviewResponse'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/olts/{olt_id}/bootstrap/apply:
    post:
      summary: Aplicar configuração inicial na OLT física (Zero-Touch Provisioning)
      description: Conecta na OLT, executa a sequência completa de configuração, ativa o auto-service, grava na memória e gera um backup de segurança inicial.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: olt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '200':
          description: Configuração inicial aplicada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapApplyResponse'
        '400':
          description: Erro nos parâmetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OLT não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Erro de conexão com a OLT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/backups/run-all:
    post:
      summary: Disparar rotina de backup em lote para todas as OLTs
      description: Executa coleta paralela/sequencial de backup em todo o parque de OLTs com expurgo automático.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: purge_after
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgePolicy'
      responses:
        '200':
          description: Resultado da execução do lote de backups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchBackupResult'

  /api/v1/backups/audit-all:
    get:
      summary: Auditoria consolidada de integridade de todo o parque de OLTs
      description: Retorna o status de integridade, contagem e drifts de cada OLT.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Lista de relatórios de auditoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupAuditReport'

  /api/v1/backups/purge-all:
    post:
      summary: Expurgo global de backups em todas as OLTs
      description: Aplica a política de retenção liberando espaço em disco para todas as OLTs.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurgePolicy'
      responses:
        '200':
          description: Resultado do expurgo global
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResult'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave de API secreta para autenticação de clientes externos.

  schemas:
    OLTCreateRequest:
      type: object
      required:
        - name
        - vendor
        - model
        - host
        - username
        - password
      properties:
        name:
          type: string
          example: "OLT-POP-CENTRO"
        vendor:
          type: string
          enum: [intelbras, huawei, fiberhome, vsol, zte, parks]
          example: "intelbras"
        model:
          type: string
          example: "8820"
        host:
          type: string
          example: "192.168.10.2"
        port:
          type: integer
          default: 22
          example: 22
        protocol:
          type: string
          enum: [ssh, telnet]
          default: ssh
        username:
          type: string
          example: "admin"
        password:
          type: string
          example: "admin123"

    Link:
      type: object
      required:
        - href
        - method
      properties:
        href:
          type: string
          example: "/api/v1/olts/0191e4f2-51a8-7d84-a12b-3456789abcde"
        method:
          type: string
          example: "GET"
        description:
          type: string
          example: "Ver detalhes da OLT"

    ConnectionTestResult:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        host:
          type: string
        port:
          type: integer
        reachable:
          type: boolean
        latency_ms:
          type: number
          format: float
          nullable: true
        message:
          type: string
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    OLTResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "0191e4f2-51a8-7d84-a12b-3456789abcde"
        name:
          type: string
        vendor:
          type: string
        model:
          type: string
        host:
          type: string
        port:
          type: integer
        protocol:
          type: string
        status:
          type: string
          example: "online"
        connection_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    OLTConfigResponse:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        collected_at:
          type: string
          format: date-time
        config_text:
          type: string
          description: Conteúdo textual completo do running-config.
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    BackupMetadata:
      type: object
      properties:
        backup_id:
          type: string
          format: uuid
          description: Identificador único no padrão UUIDv7.
        olt_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        size_bytes:
          type: integer
        sha256_hash:
          type: string
        filename:
          type: string
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    BackupDiffResult:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        base_backup_id:
          type: string
          format: uuid
        target_backup_id:
          type: string
          format: uuid
        identical:
          type: boolean
          description: Indica se os backups possuem hash SHA-256 idêntico.
        base_sha256:
          type: string
        target_sha256:
          type: string
        diff_lines:
          type: array
          items:
            type: string
        additions_count:
          type: integer
        deletions_count:
          type: integer

    BackupAuditReport:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        olt_name:
          type: string
        total_backups:
          type: integer
        total_bytes:
          type: integer
        latest_backup:
          $ref: '#/components/schemas/BackupMetadata'
        previous_backup:
          $ref: '#/components/schemas/BackupMetadata'
        has_changed:
          type: boolean
        last_backup_at:
          type: string
          format: date-time

    PurgePolicy:
      type: object
      properties:
        max_backups_per_olt:
          type: integer
          default: 30
          minimum: 1
        max_age_days:
          type: integer
          minimum: 1

    PurgeResult:
      type: object
      properties:
        olt_id:
          type: string
          nullable: true
        deleted_count:
          type: integer
        freed_bytes:
          type: integer
        remaining_count:
          type: integer

    BatchBackupResult:
      type: object
      properties:
        total_olts:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        backups:
          type: array
          items:
            $ref: '#/components/schemas/BackupMetadata'
        errors:
          type: array
          items:
            type: object

    ONUSummary:
      type: object
      properties:
        port:
          type: string
          example: "1/1"
        onu_id:
          type: integer
          example: 1
        serial:
          type: string
          example: "INCL12345678"
        status:
          type: string
          example: "online"
        name:
          type: string
          example: "Cliente_Joao"

    ONUDetails:
      type: object
      properties:
        port:
          type: string
        onu_id:
          type: integer
        serial:
          type: string
        status:
          type: string
          example: "online"
        name:
          type: string
        rx_power_dbm:
          type: number
          format: float
          example: -19.45
        tx_power_dbm:
          type: number
          format: float
          example: 2.10
        vlan:
          type: integer
          example: 100

    UnauthorizedONU:
      type: object
      properties:
        port:
          type: string
          example: "1/1"
        serial:
          type: string
          example: "INCL12345678"
        model:
          type: string
          example: "110B"
        detected_at:
          type: string
          format: date-time
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    ProvisionRequest:
      type: object
      required:
        - port
        - serial
        - vlan
      properties:
        port:
          type: string
          example: "1/1"
        serial:
          type: string
          example: "INCL12345678"
        vlan:
          type: integer
          minimum: 1
          maximum: 4094
          example: 100
        profile:
          type: string
          example: "PLAN_100M"
        description:
          type: string
          example: "Cliente_Joao_Silva"
        onu_model:
          type: string
          example: "auto"

    ProvisionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        port:
          type: string
          example: "1/1"
        onu_id:
          type: integer
          example: 3
        serial:
          type: string
          example: "INCL12345678"
        message:
          type: string
          example: "ONU provisionada e salva com sucesso na memória da OLT."
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    ONUActionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        action:
          type: string
          example: "deprovision"
          enum: [deprovision, reboot, suspend, resume]
        olt_id:
          type: string
          format: uuid
          example: "0191e4f2-51a8-7d84-a12b-3456789abcde"
        serial:
          type: string
          example: "INCL12345678"
        port:
          type: string
          example: "1/1"
        onu_id:
          type: integer
          example: 1
        message:
          type: string
          example: "ONU desprovisionada com sucesso."
        _links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Descrição detalhada do erro."
        code:
          type: string
          example: "CLI_COMMAND_FAILED"

    BootstrapRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [single_vlan, vlan_per_pon]
          default: single_vlan
        uplink_port:
          type: string
          default: "1"
          example: "1"
        vlan:
          type: integer
          minimum: 1
          maximum: 4094
          default: 100
          example: 100
        vlan_per_pon:
          type: object
          additionalProperties:
            type: integer
          example: {"1": 101, "2": 102}
        default_onu_mode:
          type: string
          enum: [router, bridge]
          default: router
        force:
          type: boolean
          default: false

    BootstrapPreviewResponse:
      type: object
      properties:
        olt_id:
          type: string
          format: uuid
        mode:
          type: string
        commands:
          type: array
          items:
            type: string
        script_text:
          type: string
        total_commands:
          type: integer

    BootstrapApplyResponse:
      type: object
      properties:
        success:
          type: boolean
        olt_id:
          type: string
          format: uuid
        backup_id:
          type: string
          format: uuid
        total_commands_executed:
          type: integer
        message:
          type: string
