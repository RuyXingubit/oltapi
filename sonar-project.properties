sonar.projectKey=RuyXingubit_oltapi
sonar.organization=ruyxb-atm1199
sonar.projectName=oltapi
sonar.sourceEncoding=UTF-8

# Código-fonte de produção (Backend Python + Frontend Flutter/Dart)
sonar.sources=app,frontend/lib

# Testes automatizados (Backend Pytest + Frontend Flutter Test)
sonar.tests=tests,frontend/test

# Exclusões para evitar falsos positivos, arquivos gerados, caches e migrações
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/*.g.dart,**/*.freezed.dart,frontend/build/**,frontend/.dart_tool/**,docs/**,site/**,alembic/**

# Configurações de Linguagem e Relatórios de Cobertura
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.dart.lcov.reportPaths=frontend/coverage/lcov.info
