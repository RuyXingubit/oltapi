services:
  postgres:
    image: postgres:16-alpine
    container_name: oltapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oltapi}
      POSTGRES_USER: ${POSTGRES_USER:-oltuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oltpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oltuser} -d ${POSTGRES_DB:-oltapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  oltapi:
    image: xingubit/oltapi:latest
    container_name: oltapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-OLT Provisioning & Diagnostics API}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY}
      - POSTGRES_USER=${POSTGRES_USER:-oltuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-oltpassword}
      - POSTGRES_DB=${POSTGRES_DB:-oltapi}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DATABASE_URL=${DATABASE_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DEFAULT_SSH_TIMEOUT=${DEFAULT_SSH_TIMEOUT:-15}
      - BACKUP_RETENTION_MAX=${BACKUP_RETENTION_MAX:-30}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-60}
      - SCANNER_ENABLED_ON_STARTUP=${SCANNER_ENABLED_ON_STARTUP:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: xingubit/oltapi-frontend:latest
    container_name: oltapi_frontend
    restart: unless-stopped
    depends_on:
      oltapi:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  watchtower:
    image: containrrr/watchtower
    container_name: oltapi_watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_SCHEDULE=0 30 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: oltapi oltapi_frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
